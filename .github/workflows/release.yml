name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      debian_release:
        description: 'DEBIAN_RELEASE to build against'
        default: '13.6.0'
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: write

env:
  DEBIAN_RELEASE: ${{ inputs.debian_release || '13.6.0' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: sudo apt-get update && sudo apt-get install -y xorriso wget whois cpio xz-utils

      - name: Import the Debian CD signing key
        run: |
          key=DF9B9C49EAA9298432589D76DA87E80D6294BE9B
          for ks in keyring.debian.org keys.openpgp.org; do
            gpg --keyserver "$ks" --recv-keys "$key" && exit 0
            echo "::warning::$ks did not serve $key"
          done
          exit 1

      - uses: actions/cache@v4
        with:
          path: out/debian-${{ env.DEBIAN_RELEASE }}-amd64-netinst.iso
          key: netinst-${{ env.DEBIAN_RELEASE }}

      - name: Build
        env:
          USERHASH: '$6$ci$3xT0lTBnPzMHK'
          SSH_PUBKEY: 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGciTest ci@example'
          CHECK_SIGNATURE: 'yes'
        run: ./build-iso.sh

      - name: Verify the built ISO
        run: ./verify-iso.sh

      - name: Install QEMU for the boot test
        run: sudo apt-get install -y qemu-system-x86 qemu-utils ovmf

      - name: Build an ISO with a serial console
        env:
          USERHASH: '$6$ci$3xT0lTBnPzMHK'
          SSH_PUBKEY: 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGciTest ci@example'
          CHECK_SIGNATURE: 'yes'
          SERIAL_CONSOLE: 'ttyS0,115200n8'
        run: ./build-iso.sh

      - name: Boot smoke test
        run: |
          ls -l /dev/kvm || echo "::warning::no /dev/kvm on this runner, QEMU falls back to TCG"
          make smoke
          make smoke-uefi

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --generate-notes \
            --notes "Tested against Debian ${DEBIAN_RELEASE}.

          \`\`\`sh
          git checkout ${GITHUB_REF_NAME}
          echo \"ssh-ed25519 AAAA... user@host\" > custom/authorized_keys
          ./build-iso.sh
          \`\`\`"
