name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      debian_release:
        description: 'DEBIAN_RELEASE to build against'
        default: '13.6.0'
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: write

env:
  DEBIAN_RELEASE: ${{ inputs.debian_release || '13.6.0' }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        layout: [raid1, single]
        swap: ['', 0]
        variant: [netinst]
        include:
          - layout: raid1
            swap: ''
            variant: offline
    env:
      DISK_LAYOUT: ${{ matrix.layout }}
      SWAP_SIZE: ${{ matrix.swap }}
      ISO_VARIANT: ${{ matrix.variant }}
      SMOKE_NET: ${{ matrix.variant == 'offline' && 'restricted' || 'user' }}
    steps:
      - uses: actions/checkout@v4

      - run: sudo apt-get update && sudo apt-get install -y xorriso wget whois cpio xz-utils

      - name: Import the Debian CD signing key
        run: |
          key=DF9B9C49EAA9298432589D76DA87E80D6294BE9B
          for ks in keyring.debian.org keys.openpgp.org; do
            gpg --keyserver "$ks" --recv-keys "$key" && exit 0
            echo "::warning::$ks did not serve $key"
          done
          exit 1

      - uses: actions/cache@v4
        with:
          path: out/debian-${{ env.DEBIAN_RELEASE }}-amd64-netinst.iso
          key: debian-${{ env.DEBIAN_RELEASE }}-netinst

      - name: Build
        env:
          USERHASH: '$6$ci$3xT0lTBnPzMHK'
          SSH_PUBKEY: 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGciTest ci@example'
          CHECK_SIGNATURE: 'yes'
        run: ./build-iso.sh

      - name: Verify the built ISO
        run: ./verify-iso.sh

      - name: Install QEMU for the boot test
        run: sudo apt-get install -y qemu-system-x86 qemu-utils ovmf

      - name: Boot smoke test (${{ matrix.variant }}, ${{ matrix.layout }}, SWAP_SIZE=${{ matrix.swap || 'default' }})
        run: |
          ls -l /dev/kvm || echo "::warning::no /dev/kvm on this runner, QEMU falls back to TCG"
          make smoke
          make smoke-uefi
      - name: Boot smoke test with a second disk left alone
        if: matrix.layout == 'single'
        run: make smoke SMOKE_DISKS=2

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the release with the notes from the annotated tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --force origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          [ "$(git cat-file -t "${GITHUB_REF_NAME}")" = tag ] || {
            echo "::error::${GITHUB_REF_NAME} is not an annotated tag; recreate it with: git tag -a --cleanup=verbatim -F <notes.md> <tag>"
            exit 1
          }
          git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" > notes.md
          gh release create "${GITHUB_REF_NAME}" --verify-tag --title "${GITHUB_REF_NAME}" --notes-file notes.md
