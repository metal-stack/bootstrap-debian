name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck and tests
        run: make check

  layouts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        layout: [raid1, single]
        swap: ['', 0]
        variant: [netinst]
        include:
          - layout: raid1
            swap: ''
            variant: offline
    env:
      USERHASH: '$6$ci$3xT0lTBnPzMHK'
      SSH_PUBKEY: 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGciTest ci@example'
    steps:
      - uses: actions/checkout@v4
      - name: Build tools
        run: sudo apt-get update && sudo apt-get install -y xorriso wget whois cpio xz-utils
      - name: Name the source image
        id: source
        run: |
          release=$(bash -c 'source ./build-iso.sh >/dev/null; echo "$DEBIAN_RELEASE"')
          echo "release=$release" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: out/debian-${{ steps.source.outputs.release }}-amd64-netinst.iso
          key: debian-${{ steps.source.outputs.release }}-netinst
      - name: Build and verify
        env:
          DISK_LAYOUT: ${{ matrix.layout }}
          SWAP_SIZE: ${{ matrix.swap }}
          ISO_VARIANT: ${{ matrix.variant }}
        run: make verify
